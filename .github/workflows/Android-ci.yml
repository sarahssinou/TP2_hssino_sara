name: AndroidCI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Grant execute permission for gradlew
        run: echo "No gradlew file, skipping"

      - name: Build with Gradle
        run: echo "No Gradle build, skipping"

      - name: Run unit tests
        run:  echo "Simulate unit tests"
        exit 1  # test échoue
